services:
  hanni:
    build:
      context: hanni
      dockerfile: ../Dockerfile
    ports:
      - "3460:3460"
      - "80:80"
      - "443:443"
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
      - HANNI_DOMAIN=${HANNI_DOMAIN:-}
    volumes:
      - ./config.json:/opt/hanni/config.json
      - ./tokens.json:/opt/hanni/tokens.json
      - hanni-repos:/opt/hanni/repos
      - hanni-worktrees:/opt/hanni/worktrees
      - hanni-logs:/opt/hanni/logs
      - hanni-claude:/home/hanni/.claude
      - hanni-caddy:/home/hanni/.local/share/caddy
      - hanni-data:/opt/hanni/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3460/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# 本番データは /opt/hanni-deploy 時代に作られた hanni-deploy_* volume に入っている。
# ディレクトリを /opt/hanni-main に改名した後もvolume名は据え置きのため、
# 明示的に name 指定しないと compose が空の hanni-main_* を新規作成してデータが外れる
# （2026-08-10 に一度発生。スケジューラ発火記録が消えてニュースが重複配信された）。
volumes:
  hanni-repos:
    name: hanni-deploy_hanni-repos
  hanni-worktrees:
    name: hanni-deploy_hanni-worktrees
  hanni-logs:
    name: hanni-deploy_hanni-logs
  hanni-claude:
    name: hanni-deploy_hanni-claude
  hanni-caddy:
    name: hanni-deploy_hanni-caddy
  hanni-data:
    name: hanni-deploy_hanni-data
